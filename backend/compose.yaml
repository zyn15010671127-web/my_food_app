services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: diet
      POSTGRES_USER: diet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diet -d diet"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      APP_ENV: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: diet
      DB_USER: diet
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SEED_DEMO_DATA: "false"
      AUTO_CREATE_TABLES: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - uploads_data:/app/data/runtime
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  uploads_data:
